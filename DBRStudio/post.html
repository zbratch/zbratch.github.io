<script>
  const params = new URLSearchParams(location.search);
  const id  = params.get('id');
  const src = 'data/posts.json?v=' + Date.now();

  const fmtDate = iso => {
    try { return new Date(iso).toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'}); }
    catch { return iso||''; }
  };

  fetch(src).then(r=>{
    if(!r.ok) throw new Error('HTTP '+r.status);
    return r.json();
  }).then(data=>{
    const p = (data.posts||[]).find(x=>String(x.id)===String(id));
    const titleEl = document.getElementById('title');
    const metaEl  = document.getElementById('meta');
    const capEl   = document.getElementById('caption');
    const linkEl  = document.getElementById('link');
    const imgWrap = document.getElementById('image-wrap');
    const tagsEl  = document.getElementById('tags');

    if(!p){ titleEl.textContent='Post not found'; return; }

    document.title = 'DBR Studio — ' + (p.title||'Untitled');
    titleEl.textContent = p.title || 'Untitled';
    metaEl.textContent = [p.author, fmtDate(p.date), p.category].filter(Boolean).join(' · ');

    if (p.image && String(p.image).trim() !== ''){
      const img = new Image();
      img.src = p.image; img.alt = p.title || ''; img.className='detail-img';
      imgWrap.replaceChildren(img);
    } else imgWrap.remove();

    if (p.caption && String(p.caption).trim() !== '') capEl.textContent = p.caption;
    else capEl.remove();

    // ---------- NEW: support p.links[] (preferred) + legacy p.link ----------
    const urls = [];
    if (Array.isArray(p.links)) {
      p.links.forEach(u => { if (u && String(u).trim() !== '') urls.push(String(u).trim()); });
    } else if (p.link && String(p.link).trim() !== '') {
      urls.push(String(p.link).trim());
    }

    if (urls.length) {
      const frag = document.createDocumentFragment();

      urls.forEach((url, i) => {
        const block = document.createElement('div');
        block.style.marginTop = i === 0 ? "0" : "14px";

        const lower = url.toLowerCase();

        // YouTube embed support
        if (url.includes("youtube.com") || url.includes("youtu.be")) {
          const iframe = document.createElement('iframe');
          let embed = url;

          if (url.includes("watch?v=")) {
            const vid = url.split("watch?v=")[1].split("&")[0];
            embed = "https://www.youtube.com/embed/" + vid;
          } else if (url.includes("youtu.be/")) {
            const vid = url.split("youtu.be/")[1].split("?")[0];
            embed = "https://www.youtube.com/embed/" + vid;
          }

          iframe.src = embed;
          iframe.width = "100%";
          iframe.height = "500";
          iframe.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture";
          iframe.allowFullscreen = true;
          iframe.style.borderRadius = "12px";
          iframe.style.border = "0";
          block.appendChild(iframe);

        // SoundCloud embed support
        } else if (url.includes("soundcloud.com")) {
          const iframe = document.createElement('iframe');
          iframe.src = "https://w.soundcloud.com/player/?url=" + encodeURIComponent(url);
          iframe.width = "100%";
          iframe.height = "166";
          iframe.allow = "autoplay";
          iframe.style.borderRadius = "12px";
          iframe.style.border = "0";
          block.appendChild(iframe);

        // Video embed support (.mp4/.webm)
        } else if (lower.endsWith(".mp4") || lower.endsWith(".webm")) {
          const video = document.createElement('video');
          video.controls = true;
          video.playsInline = true;
          video.preload = "metadata";
          video.style.width = "100%";
          video.style.borderRadius = "12px";

          const source = document.createElement('source');
          source.src = url;
          if (lower.endsWith('.mp4')) source.type = 'video/mp4';
          else if (lower.endsWith('.webm')) source.type = 'video/webm';
          video.appendChild(source);

          // Fallback link if browser can’t play it
          const fallback = document.createElement('div');
          fallback.style.marginTop = "8px";
          const a = document.createElement('a');
          a.href = url; a.target = '_blank'; a.rel = 'noopener';
          a.textContent = 'Open video in new tab →';
          fallback.appendChild(a);

          block.appendChild(video);
          block.appendChild(fallback);

        // Fallback to normal link
        } else {
          const a = document.createElement('a');
          a.href = url; a.target='_blank'; a.rel='noopener';
          a.textContent = 'Listen / View →';
          block.appendChild(a);
        }

        frag.appendChild(block);
      });

      linkEl.replaceChildren(frag);
    } else {
      linkEl.remove();
    }
    // ---------- END NEW BLOCK ----------

    if (Array.isArray(p.tags) && p.tags.length){
      tagsEl.textContent = 'Tags: ' + p.tags.map(t=>'#'+t).join(' ');
    } else tagsEl.remove();
  }).catch(err=>{
    document.getElementById('title').textContent = 'Error loading post.'; console.error(err);
  });
</script>
