<script>
  const FEED = document.getElementById('feed');
  const TPL  = document.getElementById('card');
  const src  = 'data/posts.json?v=' + Date.now();
  const sel  = document.getElementById('category');
  const q    = document.getElementById('search');
  const clear= document.getElementById('clear');
  let ALL = [];

  const fmtDate = iso => {
    try { return new Date(iso).toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'}); }
    catch { return iso||''; }
  };

  function buildCats(posts){
    const set = new Set();
    for (const p of posts) if (p.category) set.add(p.category);
    const opts = [...set].sort();
    for (const c of opts){
      const o = document.createElement('option');
      o.value = c; o.textContent = c; sel.appendChild(o);
    }
  }

  function ytIdFrom(url){
    try{
      if (url.includes('watch?v=')) return url.split('watch?v=')[1].split('&')[0];
      if (url.includes('youtu.be/')) return url.split('youtu.be/')[1].split('?')[0];
    }catch(e){}
    return null;
  }

  // NEW: unified link getter (array preferred, fallback to single)
  function getPostLinks(p){
    const out = [];
    if (Array.isArray(p.links)) {
      for (const u of p.links) if (u && String(u).trim()) out.push(String(u).trim());
    } else if (p.link && String(p.link).trim()) {
      out.push(String(p.link).trim());
    }
    return out;
  }

  function render(list){
    FEED.replaceChildren();
    if (!list.length){ FEED.textContent='No posts match.'; return; }

    for (const p of list){
      const node  = TPL.content.cloneNode(true);
      const title = p.title || 'Untitled';
      const link  = 'post.html?id=' + encodeURIComponent(p.id);
      const links = getPostLinks(p);

      // Title
      const titleA = node.querySelector('.title');
      titleA.textContent = title;
      titleA.href = link;

      // Image: p.image -> YouTube thumb -> placeholder
      const imgWrap = node.querySelector('.image-link');
      const imgEl   = node.querySelector('.img');
      let showedImg = false;

      if (p.image && String(p.image).trim() !== ''){
        imgEl.src = p.image; imgEl.alt = title; imgWrap.href = link;
        showedImg = true;
      } else {
        const yt = links.find(u => u.includes('youtube.com') || u.includes('youtu.be'));
        if (yt){
          const id = ytIdFrom(String(yt));
          if (id){
            imgEl.src = 'https://img.youtube.com/vi/' + id + '/hqdefault.jpg';
            imgEl.alt = title + ' (YouTube)';
            imgWrap.href = link;
            showedImg = true;
          }
        }

        if (!showedImg) {
          imgEl.src =
            'data:image/svg+xml;utf8,' +
            encodeURIComponent(
              `<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675">
                <rect width="100%" height="100%" fill="#111"/>
                <circle cx="600" cy="338" r="110" fill="#fff" opacity="0.15"/>
                <polygon points="565,285 565,391 685,338" fill="#fff" opacity="0.65"/>
                <text x="50%" y="88%" dominant-baseline="middle" text-anchor="middle"
                      fill="#fff" opacity="0.6" font-family="Arial" font-size="36">
                  Video Post
                </text>
              </svg>`
            );
          imgEl.alt = title + ' (Video)';
          imgWrap.href = link;
          showedImg = true;
        }
      }

      if (!showedImg){ imgWrap.remove(); }

      // Meta
      node.querySelector('.meta').textContent =
        [p.author, fmtDate(p.date), p.category].filter(Boolean).join(' · ');

      // Caption
      const cap = node.querySelector('.caption');
      if (p.caption && String(p.caption).trim() !== '') cap.textContent = p.caption;
      else cap.remove();

      // Badge row for links (first link + +N)
      const badgeRow = node.querySelector('.badge-row');
      if (links.length){
        const url = links[0];
        const a = document.createElement('a');
        a.className = 'badge';
        a.target = '_blank'; a.rel = 'noopener';
        a.href = url;

        const more = links.length > 1 ? ` +${links.length - 1}` : '';

        if (url.includes('youtube.com') || url.includes('youtu.be')){
          a.innerHTML = '<span class="ico"></span><span>Watch' + more + '</span>';
        } else if (url.includes('soundcloud.com')){
          a.innerHTML = '<span class="ico"></span><span>Listen' + more + '</span>';
        } else if (url.toLowerCase().endsWith('.mp4') || url.toLowerCase().endsWith('.webm')) {
          a.innerHTML = '<span class="ico"></span><span>Play' + more + '</span>';
        } else {
          a.innerHTML = '<span class="ico">↗</span><span>Open' + more + '</span>';
        }
        badgeRow.appendChild(a);
      } else {
        badgeRow.remove();
      }

      // Tags
      const tagsWrap = node.querySelector('.tags');
      if (Array.isArray(p.tags) && p.tags.length){
        for (const t of p.tags){
          const a = document.createElement('a');
          a.className='tag'; a.href='index.html#'+encodeURIComponent(t);
          a.textContent = '#'+t; tagsWrap.appendChild(a);
        }
      } else tagsWrap.remove();

      FEED.appendChild(node);
    }
  }

  function applyFilters(){
    const cat = sel.value.trim().toLowerCase();
    const term= q.value.trim().toLowerCase();
    const list = ALL.filter(p=>{
      const byCat = !cat || (p.category||'').toLowerCase()===cat;
      if (!byCat) return false;
      if (!term) return true;
      const hay = [p.title,p.author,p.caption,(p.tags||[]).join(' ')].join(' ').toLowerCase();
      return hay.includes(term);
    });
    render(list);
  }

  fetch(src).then(r=>{
    if(!r.ok) throw new Error('HTTP '+r.status);
    return r.json();
  }).then(data=>{
    ALL = (data.posts||[]).slice().sort((a,b)=>new Date(b.date)-new Date(a.date));
    buildCats(ALL);
    render(ALL);
  }).catch(err=>{
    FEED.textContent='Failed to load posts.json — check the path and JSON syntax.'; console.error(err);
  });

  sel.addEventListener('change', applyFilters);
  q.addEventListener('input', applyFilters);
  clear.addEventListener('click', e=>{ e.preventDefault(); sel.value=''; q.value=''; render(ALL); });
</script>
